:root{--bg:#100e0c;--surface:#1c1916;--panel2:#151310;--line:rgba(240,232,219,.10);--line-2:rgba(240,232,219,.20);

body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  letter-spacing:-.004em}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px}
.box{position:relative;width:min(420px,92vw)}
.mark{display:flex;align-items:center;gap:9px;margin-bottom:30px}

.mark .w{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:28px}
h1{font-weight:300;letter-spacing:-.035em;font-size:46px;line-height:1;margin-bottom:14px}
.sub{color:var(--mute);font-size:14.5px;line-height:1.6;max-width:38ch;margin-bottom:28px}
form{display:flex;gap:8px;flex-wrap:wrap}

input::placeholder{color:var(--faint)}
input:focus{border-color:var(--ring)}
button.enter{background:var(--ink);color:var(--bg);font-family:var(--sans);font-weight:600;font-size:13.5px;
  letter-spacing:-.01em;border:0;padding:12px 20px;border-radius:2px;cursor:pointer;transition:background .12s}
button.enter:hover{background:#dcd6c8}
.err{color:#f87171;font-family:var(--mono);font-size:11.5px;margin-top:14px;min-height:16px}
.note{color:var(--faint);font-size:12px;margin-top:32px;line-height:1.55;max-width:36ch}
#app{position:fixed;inset:0;display:none;background:var(--bg)}
#top{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel2);
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);letter-spacing:-.005em}
#top a{color:var(--mute);text-decoration:none}#top a:hover{color:var(--ink)}
#top .t{color:var(--ink);font-weight:500}
#frame{width:100%;height:calc(100% - 48px);border:0;background:#F2EDE2}
#mount{position:fixed;inset:0;overflow:auto}
#lang{position:fixed;top:10px;right:16px;z-index:70;display:none;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--line);
  color:var(--mute);padding:7px 12px;border-radius:2px;cursor:pointer;transition:border-color .12s,color .12s}

let PW=null,LANG=localStorage.getItem('tt_lang')||'en';
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pw,blob){const r=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));const salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);const k=await derive(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(pt);}
async function render(){const useDe=(LANG==='de'&&BD);const html=await dec(PW,useDe?BD:BE);if(MODE==='index'){$('#mount').innerHTML=html;}else{$('#frame').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));const tt=$('#toptitle');if(tt)tt.textContent=(useDe&&TD)?TD:TE;}const lb=$('#lang');if(lb){lb.textContent=(LANG==='de')?'English':'Deutsch';}}
