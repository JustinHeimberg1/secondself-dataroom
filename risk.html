const $=s=>document.querySelector(s);
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pw){const r=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));const salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);const k=await derive(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(pt);}
async function unlock(pw){let html;try{html=await dec(pw);}catch(e){return false;}sessionStorage.setItem(SK,pw);$('#gate').style.display='none';$('#app').style.display='block';if(MODE==='index'){$('#mount').innerHTML=html;}else{const b=new Blob([html],{type:'text/html'});$('#frame').src=URL.createObjectURL(b);}return true;}
window.addEventListener('DOMContentLoaded',()=>{
 $('#f').addEventListener('submit',async e=>{e.preventDefault();const pw=$('#pw').value;const ok=await unlock(pw);if(!ok){$('#err').textContent='Incorrect code. Try again.';$('#pw').select();}});
 const p=sessionStorage.getItem(SK);if(p){unlock(p);}
});
