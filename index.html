<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Data Room · Tautome</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(125% 105% at 12% -5%,#3b4fe4 0%,#2F42C9 44%,#2334A8 100%);color:#fff;-webkit-font-smoothing:antialiased}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.dotgrid{position:fixed;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:28px 28px;-webkit-mask:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);mask:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);pointer-events:none}
.box{position:relative;width:min(440px,92vw)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C7CEFF;display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mono .sq{width:11px;height:11px;background:#fff}
h1{font-weight:500;letter-spacing:-.03em;font-size:clamp(34px,7vw,58px);line-height:.95;margin-bottom:14px}
.sub{color:#D7DCFF;font-size:16px;line-height:1.5;max-width:36ch;margin-bottom:30px}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 220px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:15px;padding:14px 16px;border-radius:10px;outline:none}
input::placeholder{color:#B9C0EE}input:focus{border-color:#fff;background:rgba(255,255,255,.16)}
button.enter{background:#fff;color:#2334A8;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border:0;padding:14px 22px;border-radius:10px;cursor:pointer}
.err{color:#FFD3D3;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:14px;min-height:16px}
.note{color:#AEB6EE;font-size:12px;margin-top:26px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em}
#app{position:fixed;inset:0;display:none;background:#0b0d16}
#top{height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#10131f;border-bottom:1px solid rgba(255,255,255,.1);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#AEB6EE}
#top a{color:#8A9BFF;text-decoration:none}#top .t{color:#fff}
#frame{width:100%;height:calc(100% - 46px);border:0;background:#fff}
#mount{position:fixed;inset:0;overflow:auto}
#lang{position:fixed;top:9px;right:14px;z-index:70;display:none;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.32);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}

const $=s=>document.querySelector(s);
let PW=null,LANG=localStorage.getItem('tt_lang')||'en';
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pw,blob){const r=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));const salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);const k=await derive(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(pt);}
async function render(){const useDe=(LANG==='de'&&BD);const html=await dec(PW,useDe?BD:BE);if(MODE==='index'){$('#mount').innerHTML=html;}else{$('#frame').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));const tt=$('#toptitle');if(tt)tt.textContent=(useDe&&TD)?TD:TE;}const lb=$('#lang');if(lb){lb.textContent=(LANG==='de')?'English':'Deutsch';}}
async function unlock(pw){try{await dec(pw,BE);}catch(e){return false;}PW=pw;sessionStorage.setItem(SK,pw);$('#gate').style.display='none';$('#app').style.display='block';const lb=$('#lang');if(lb&&BD){lb.style.display='block';}await render();return true;}
window.addEventListener('DOMContentLoaded',()=>{
