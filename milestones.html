<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Milestones · Tautome</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}html,body{height:100%}
:root{--bg:#0A0A0B;--surface:#121214;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);
  --ink:#EDEDEF;--body:#B9B9C2;--mute:#83838E;--faint:#5C5C66;--accent:#6E7BFF;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;font-feature-settings:"cv05","ss01"}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px}
.box{position:relative;width:min(420px,92vw)}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:28px}
h1{font-weight:600;letter-spacing:-.04em;font-size:44px;line-height:1;margin-bottom:14px}
.sub{color:var(--mute);font-size:14.5px;line-height:1.6;max-width:38ch;margin-bottom:28px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:13.5px;padding:12px 14px;border-radius:8px;outline:none;transition:border-color .12s}
input::placeholder{color:var(--faint)}
input:focus{border-color:var(--accent)}
button.enter{background:var(--ink);color:var(--bg);font-family:var(--sans);font-weight:600;font-size:13.5px;
  letter-spacing:-.01em;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;transition:opacity .12s}
button.enter:hover{opacity:.86}
.err{color:#FF8B8B;font-family:var(--mono);font-size:11.5px;margin-top:14px;min-height:16px}
.note{color:var(--faint);font-size:12px;margin-top:32px;line-height:1.55;max-width:36ch}
#app{position:fixed;inset:0;display:none;background:var(--bg)}
#top{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--bg);
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute);letter-spacing:-.005em}
#top a{color:var(--mute);text-decoration:none}#top a:hover{color:var(--ink)}
#top .t{color:var(--ink);font-weight:500}
#frame{width:100%;height:calc(100% - 48px);border:0;background:var(--bg)}
#mount{position:fixed;inset:0;overflow:auto}
#lang{position:fixed;top:10px;right:16px;z-index:70;display:none;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--line);
  color:var(--mute);padding:7px 12px;border-radius:7px;cursor:pointer;transition:border-color .12s,color .12s}

const $=s=>document.querySelector(s);
let PW=null,LANG=localStorage.getItem('tt_lang')||'en';
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pw,blob){const r=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));const salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);const k=await derive(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(pt);}
async function render(){const useDe=(LANG==='de'&&BD);const html=await dec(PW,useDe?BD:BE);if(MODE==='index'){$('#mount').innerHTML=html;}else{$('#frame').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));const tt=$('#toptitle');if(tt)tt.textContent=(useDe&&TD)?TD:TE;}const lb=$('#lang');if(lb){lb.textContent=(LANG==='de')?'English':'Deutsch';}}
async function unlock(pw){try{await dec(pw,BE);}catch(e){return false;}PW=pw;sessionStorage.setItem(SK,pw);$('#gate').style.display='none';$('#app').style.display='block';const lb=$('#lang');if(lb&&BD){lb.style.display='block';}await render();return true;}
window.addEventListener('DOMContentLoaded',()=>{
 $('#f').addEventListener('submit',async e=>{e.preventDefault();const ok=await unlock($('#pw').value);if(!ok){$('#err').textContent='Incorrect code · Falscher Code';$('#pw').select();}});
 const lb=$('#lang');if(lb)lb.addEventListener('click',()=>{LANG=(LANG==='de')?'en':'de';localStorage.setItem('tt_lang',LANG);render();});
