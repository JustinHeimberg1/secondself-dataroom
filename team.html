const $=s=>document.querySelector(s);
let PW=null,LANG=localStorage.getItem('tt_lang')||'en';
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pw,blob){const r=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));const salt=r.slice(0,16),iv=r.slice(16,28),d=r.slice(28);const k=await derive(pw,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,d);return new TextDecoder().decode(pt);}
async function render(){const useDe=(LANG==='de'&&BD);const html=await dec(PW,useDe?BD:BE);if(MODE==='index'){$('#mount').innerHTML=html;}else{$('#frame').src=URL.createObjectURL(new Blob([html],{type:'text/html'}));const tt=$('#toptitle');if(tt)tt.textContent=(useDe&&TD)?TD:TE;}const lb=$('#lang');if(lb){lb.textContent=(LANG==='de')?'English':'Deutsch';}}
async function unlock(pw){try{await dec(pw,BE);}catch(e){return false;}PW=pw;sessionStorage.setItem(SK,pw);$('#gate').style.display='none';$('#app').style.display='block';const lb=$('#lang');if(lb&&BD){lb.style.display='block';}await render();return true;}
window.addEventListener('DOMContentLoaded',()=>{
 $('#f').addEventListener('submit',async e=>{e.preventDefault();const ok=await unlock($('#pw').value);if(!ok){$('#err').textContent='Incorrect code · Falscher Code';$('#pw').select();}});
